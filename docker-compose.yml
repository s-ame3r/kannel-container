services:
  kannel:
    build:
      context: .
      dockerfile: Dockerfile
    image: kannel:local
    pull_policy: build
    container_name: kannel
    restart: unless-stopped
    ports:
      - "10000:10000" # fake SMSC 1
      - "10001:10001" # fake SMSC 2
      - "10002:10002" # fake SMSC 3
      - "10003:10003" # fake SMSC 4
      - "10004:10004" # fake SMSC 5
      - "12000:12000" # admin / status
      - "12013:12013" # sendsms API
    volumes:
      - ./kannel.conf:/etc/kannel/kannel.conf:ro
      - ./smsc.d:/etc/kannel/smsc.d:ro
      - kannel-logs:/var/log/kannel
      - kannel-spool:/var/spool/kannel

volumes:
  kannel-logs:
  kannel-spool:
