services:
  kannel:
    build:
      context: .
      dockerfile: Dockerfile
    image: kannel:local
    pull_policy: build
    container_name: kannel
    restart: unless-stopped
    ports:
      - "10000:10000" # fake SMSC
      - "12000:12000" # admin / status
      - "12013:12013" # sendsms API
    volumes:
      - ./kannel.conf:/etc/kannel/kannel.conf:ro
      - kannel-logs:/var/log/kannel
      - kannel-spool:/var/spool/kannel

volumes:
  kannel-logs:
  kannel-spool:
