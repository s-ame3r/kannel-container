group = core
admin-port = 12000
admin-password = test
status-password = foobar
admin-deny-ip = ""
admin-allow-ip = "127.0.0.1;*.*.*.*"
smsbox-port = 12001
box-deny-ip = ""
box-allow-ip = "127.0.0.1;*.*.*.*"
#dlr-storage = internal
log-level = 1
log-file = "/var/log/kannel/bearerbox_server.log"
store-type = file
store-location = "/var/spool/kannel/kannel_server.store"
